openapi: 3.0.3
info:
  title: Belief Evolution Simulator API
  version: 1.0.0
  description: |
    REST + WebSocket API for the Belief Evolution Simulator.

    All protected endpoints require `Authorization: Bearer <Firebase idToken>`.

    **Deactivated accounts** (`POST /api/users/me/deactivate`) get
    `401 {"error": "unauthorized", "message": "Account is deactivated"}` on every protected REST
    endpoint, `/api/users/sync` and `/api/users/info/{uid}` included. Reactivation has no
    endpoint: an administrator sets `users.deactivated = false` in the database.

    **Errors (#123).** Every non-2xx JSON answer has the body
    `{"error": "<code>", "message": "<text>"}` (schema `Error`), plus `fields` on some
    `400 invalid_body` answers, and carries the CORS headers — including the answers to unknown
    paths, wrong methods, unreadable bodies and unexpected failures, which a global handler
    produces for every path, with and without the `/api` prefix. `error` is stable; `message` is
    for humans and may change.

    | Status | `error` | When |
    |---|---|---|
    | 400 | `invalid_body` | the body is not JSON (`Malformed JSON: ...`), a member is missing or has the wrong type (`fields: [{"field": "agentTypes.count", "issue": "..."}]`; the path omits array indexes), the body is missing, a query parameter is malformed (`fields` names it), or an endpoint-specific check fails |
    | 400 | `bad_request` | any other malformed request, e.g. `GET /ws` without a WebSocket upgrade |
    | 401 | `unauthorized` | missing, invalid or expired token; deactivated account (`Account is deactivated`) |
    | 401 | `token_revoked` | valid signature, but the session was revoked or the Firebase account is disabled or deleted: sign in again |
    | 403 | `forbidden` | not the owner / not an Administrator |
    | 404 | `not_found` | unknown path (any method) or unknown resource |
    | 405 | `method_not_allowed` | known path, other method; the `Allow` header lists the methods |
    | 406 | `not_acceptable` | the `Accept` header excludes every representation |
    | 409 | `conflict` | e.g. cancelling a finished run |
    | 410 | `gone` | removed legacy endpoint (see below) |
    | 413 | `payload_too_large` | body above 64 MB (`akka.http.server.parsing.max-content-length`) |
    | 415 | `unsupported_media_type` | a `Content-Type` the endpoint does not read |
    | 422 | `usage_limit_exceeded` | role quota exceeded; adds `limit` and `requested` |
    | 422 | `invalid_measure` | polarization: the measure, a parameter or `k` is rejected by pol_measures (`fields` names it) |
    | 500 | `internal_error` | unexpected failure; logged server-side, the body never carries exception details |
    | 503 | `request_timeout` | no answer within `akka.http.server.request-timeout` (60 s) |
    | 503 | `unavailable` | polarization: the pol_measures worker is not available (could not start, crashed, timed out, busy); retry later |

    Authentication runs before the body is read: a malformed body sent with a missing or invalid
    token answers `401`, not `400`.

    **Token verification (REST and WebSocket alike).** (1) The signature, `exp`, audience and
    issuer are verified locally against Google's public keys; a failure is `401 unauthorized`
    ("Invalid or expired token") and Firebase is not contacted. (2) Then the revocation check asks
    Firebase for the user record: a token issued before the user's sessions were revoked
    (`iat` < `tokensValidAfterTimestamp`), a disabled account or a deleted account answers
    `401 token_revoked` (WebSocket: `auth_failed` with `reason: token_revoked`). A passed check of
    a given token is reused for at most 5 minutes (never past its `exp`), so a revocation takes
    effect within 5 minutes. **The revocation check fails open:** if it cannot run (network error,
    3-second deadline, missing permission or credentials, Firebase outage), the token verified in
    step 1 is accepted, reused for at most 60 seconds before the check is retried, and the server
    logs a rate-limited warning; an outage of Firebase's user API therefore does not sign everybody
    out, and revocations are not enforced while it lasts. A client that gets any `401` should
    refresh its ID token once and retry, then sign in again.

    **Save modes:** `0` = FULL, `1` = STANDARD, `2` = STANDARD_LIGHT (`SaveModes.codeToSaveMode`;
    DEBUG — no per-agent DB writes — is internal code `7`).
    In this phase `saveMode` is required but ignored, by design (#133): while `APP_LEGACY_DB=false`
    the server runs every simulation in DEBUG mode, so no per-agent data is written — only the run
    row and, with `persistFrames=true`, the frames (see *Retention of run data* below).

    **Silence strategies:** `0` = DEGROOT, `1` = MAJORITY, `2` = THRESHOLD, `3` = CONFIDENCE

    **Silence effects:** `0` = DEGROOT, `1` = MEMORY, `2` = MEMORYLESS

    **Cognitive biases:** `0` = DEGROOT, `1` = CONFIRMATION, `2` = BACKFIRE, `3` = AUTHORITY, `4` = INSULAR

    **Retention of run data.** Only the run row and, with `persistFrames=true`, the round frames
    (`network_frames`) are persisted. Topology / results snapshots and the network list live in
    backend memory with a retention driven by the run state:

    | Data | While `running` | After the run ends (`completed` / `cancelled` / `error`) |
    |---|---|---|
    | Frames, `frameRetention=ephemeral` | kept | deleted 60–90 min after `completed_at` (cleanup: 60 min grace, every 30 min) |
    | Frames, `frameRetention=persistent` | kept | kept (Administrators only) |
    | Topology / results / network ids (memory), ephemeral run | kept | kept 95 min after the run ends (outlasts its frames) |
    | Topology / results / network ids (memory), persistent run | kept | kept while the backend process lives |
    | WS replay buffer (memory) | kept (oldest frames dropped past 200 MB) | 60 min, then DB replay |

    Memory is additionally capped by `APP_SIM_CACHE_BUDGET_MB` (snapshots, default
    min(512 MB, heap/8)) and `APP_WS_BUFFER_BUDGET_MB` (WS buffers of all runs, default
    min(1024 MB, heap/4)); when a cap is exceeded the oldest **finished** runs are evicted first and
    running runs never are (WS buffers then drop the oldest binary frames of the largest running
    buffer; control events are never dropped). Each WS connection also caps the binary frames queued
    for it and not yet sent at `APP_WS_CONNECTION_BUFFER_MB` (default min(32 MB, heap/64); see
    `/ws`). **A backend restart loses everything in memory**:
    `/networks` then falls back to the networks that still have persisted frames, while `/topology`
    and `/results` answer `202` (the snapshot will not come back). Runs left `running` by the
    previous process are set to `error` at startup.

    **Removed legacy endpoints (#121).** The anonymous binary endpoints `POST /run`,
    `POST /custom` and `GET /neighbors` (also under `/api`) were removed after their Sunset date
    (2026-09-01) and are no longer part of this spec. Any method on those exact paths answers
    `410 Gone` with `{"error": "gone", "message": "..."}` and a `Link` header with RELATIVE
    references (resolved against the requested URL, so they keep the `/api` prefix):
    `<simulations/generated>; rel="successor-version"` for `/run`,
    `<simulations/custom>; rel="successor-version"` for `/custom` and `/neighbors`, plus
    `<docs>; rel="service-doc"`. The request body is not read and no run is started. Use the
    authenticated `POST /simulations/generated` and `POST /simulations/custom` instead (the binary
    `application/octet-stream` variant of the latter takes the former `POST /custom` payload).

    **Polarization measures (#129).** `GET /simulations/polarization/measures` and
    `POST /simulations/polarization` compute polarization with the real Python package
    [pol_measures](https://github.com/Ulvenforst/pol_measures) (package `measures`), pinned to a
    commit in the backend image (`ARG POL_MEASURES_REF` of the Dockerfile; the answers carry the
    installed commit). A worker process inside the backend container is started on the first
    request and reused; requests are computed one at a time, each within 30 s
    (`APP_POLARIZATION_TIMEOUT_SECONDS`), and a worker that times out or crashes is restarted
    (that request answers `503 unavailable`). With `APP_POLARIZATION=false` (default: enabled)
    both paths answer `404 not_found` to any method, before authentication, and Python is never
    started.

servers:
  # Relativo al origen de la página que sirve estos docs: en prod resuelve a
  # https://silensess.lipn.univ-paris13.fr/api y en local a
  # http://localhost:9000/api (el dual-mount de Server.scala acepta el prefijo).
  # Sin esto, el "Try it out" de /api/docs en prod apuntaba a localhost.
  - url: /api
    description: Mismo origen que estos docs (prod vía reverse proxy, o local)
  - url: http://localhost:9000
    description: Local development (backend directo, sin prefijo)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase idToken

  responses:
    Unauthorized:
      description: |
        `unauthorized` — missing, malformed, invalid or expired token, or deactivated account
        (`Account is deactivated`). `token_revoked` — the signature is valid but the session was
        revoked or the Firebase account is disabled or deleted (checked with Firebase; a passed
        check is reused for at most 5 minutes; the check fails open when Firebase cannot be
        reached, see *Token verification*): sign in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid:
              value:
                error: unauthorized
                message: Invalid or expired token
            missing:
              value:
                error: unauthorized
                message: Missing Bearer token
            revoked:
              value:
                error: token_revoked
                message: The session was revoked or the account is disabled; sign in again
            deactivated:
              value:
                error: unauthorized
                message: Account is deactivated
    NotFound:
      description: "`not_found` — unknown path (any method, with or without `/api`) or unknown resource."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: The requested resource could not be found
    MethodNotAllowed:
      description: "`method_not_allowed` — the path exists but not with this method; see the `Allow` header."
      headers:
        Allow:
          schema:
            type: string
          example: GET, OPTIONS
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: method_not_allowed
            message: "HTTP method not allowed, supported methods: GET"
    PayloadTooLarge:
      description: "`payload_too_large` — the body exceeds 64 MB (`akka.http.server.parsing.max-content-length`)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
            message: The request body exceeds the maximum allowed size of 67108864 bytes
    UnsupportedMediaType:
      description: "`unsupported_media_type` — a `Content-Type` this endpoint does not read."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
            message: "The request has Content-Type 'text/plain; charset=UTF-8'; expected: application/json"
    InternalError:
      description: "`internal_error` — unexpected server failure (logged server-side; no exception details in the body)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: Internal server error

  schemas:
    Error:
      type: object
      description: |
        Body of every non-2xx JSON answer (#81, #123); see *Errors* in the API description for the
        codes. `fields` appears only on some `400 invalid_body` answers; `limit` and `requested`
        only on `422 usage_limit_exceeded`.
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code.
          example: invalid_body
        message:
          type: string
          description: Human-readable explanation (not a stable identifier).
          example: "Invalid request body: Expected Int as JsNumber, but got \"ten\""
        fields:
          type: array
          description: |
            The rejected inputs: `field` is the JSON path of a request-body member (outermost
            member first, array indexes omitted, e.g. `agentTypes.count`) or the name of a query
            parameter; `issue` says what is wrong with it.
          items:
            $ref: '#/components/schemas/FieldIssue'
        limit:
          type: integer
          description: "`usage_limit_exceeded` only: the caller's quota."
        requested:
          type: integer
          description: "`usage_limit_exceeded` only: the requested value."
      example:
        error: invalid_body
        message: "Invalid request body: Expected Int as JsNumber, but got \"ten\""
        fields:
          - field: agentTypes.count
            issue: "Expected Int as JsNumber, but got \"ten\""

    FieldIssue:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
          example: agentTypes.count
        issue:
          type: string
          example: "Expected Int as JsNumber, but got \"ten\""

    UsageLimits:
      type: object
      description: |
        Per-role quotas enforced server-side by `POST /simulations/generated` and
        `POST /simulations/custom` (JSON and binary). `null` means unlimited.

        | Role | maxAgents | maxIterations | maxNetworks | densityFactor |
        |---|---|---|---|---|
        | Guest | 10 | 10 | 1 | 0.5 |
        | BaseUser | 100 | 100 | 5 | 0.5 |
        | Researcher | 1000 | 1000 | 20 | 0.75 |
        | Administrator | null | null | null | 1.0 |
      properties:
        maxAgents:
          type: integer
          nullable: true
        maxIterations:
          type: integer
          nullable: true
        densityFactor:
          type: number
          format: float
        maxNetworks:
          type: integer
          nullable: true
          description: |
            Maximum `numberOfNetworks` of a generated run. Custom runs are always a single network.

    UserInfo:
      type: object
      properties:
        uid:
          type: string
        email:
          type: string
        name:
          type: string
        photo:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum: [Administrator, Researcher, BaseUser, Guest]
        usageLimits:
          $ref: '#/components/schemas/UsageLimits'
        deactivated:
          type: boolean

    RunSummary:
      type: object
      properties:
        id:
          type: string
          description: Snowflake ID (64-bit, returned as string)
        type:
          type: string
          enum: [generated, custom]
        name:
          type: string
          nullable: true
        networkCount:
          type: integer
        iterationLimit:
          type: integer
        stopThreshold:
          type: number
          format: float
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [running, completed, cancelled, error]
          description: |
            Run lifecycle state.
            - `running`: at least one network is still active. Initial state at run creation.
            - `completed`: `Monitor` emitted `run_completed` (all networks done — converged or hit iteration limit).
            - `cancelled`: `DELETE /simulations/{runId}` was processed while the run was `running`.
            - `error`: the run stopped abnormally — an actor of the run failed (subscribers receive the
              WS `error` event), or the backend process ended (restart / crash) while the run was
              `running`: such rows are set to `error` when the next process starts.

            The three terminal states set `completed_at` and are final: a terminal status is never
            overwritten (`DELETE` on a finished run answers `409`).

            Convergence is per-network and surfaces via the `network_converged` WS event;
            at the run level a converged run is just `completed`.

            **Note:** while `APP_LEGACY_DB=false` the run row (with its `status`) is always
            written, even though every run executes in DEBUG save mode, so `GET /simulations/{runId}`
            keeps answering after reconnects. Only with `APP_SKIP_DATABASE=true` is no row written;
            then `404 Not Found` means "run no longer trackable" and status must be inferred from
            live WS events.
        seed:
          type: string
          nullable: true
          pattern: '^-?[0-9]+$'
          example: '4503599627370496'
          description: |
            Seed of a **generated** run (#127): the `seed` of the request, or the one the server
            drew (uniformly in `[0, 2^53 − 1]`) when it was null, omitted or `-1`
            (`generated_runs.seed`). A decimal string because the column is a 64-bit integer (a
            request may send any int64), like the ids. `null` for custom runs, which take no seed.
            Same value in `GET /simulations/{runId}`, the run lists and `GET /simulations/{runId}/config`.

            **Reproducibility:** sending this seed again with the same configuration rebuilds the
            same networks and dynamics on the same server (the simulator's vectorised float
            arithmetic depends on the CPU, so another server may differ slightly). Runs created
            before #127 are the exception: their stored value is what the simulator received and
            mixed with that run's id, so re-sending it starts a different run.

    SimCreated:
      type: object
      properties:
        runId:
          type: string
          description: Snowflake ID (64-bit, returned as string)
        status:
          type: string
          enum: [running]
        networkCount:
          type: integer
        effectiveDensity:
          type: integer
          description: |
            Generated runs only (omitted for custom runs). Barabási–Albert `m` actually used to
            build every network: `floor(density × densityFactor)` clamped to
            `[1, agentsPerNetwork − 1]` (0 would build an edgeless network; `m ≥ agentsPerNetwork`
            cannot be built).
        wsUrl:
          type: string
          example: /ws
          description: |
            Constant path of the persistent WebSocket endpoint.
            After receiving this response, send `{"type":"subscribe","runId":"<runId>"}` over the
            already-open WS connection (see `GET /ws`).

    GeneratedRunConfig:
      type: object
      description: |
        Stored configuration of a generated run (#127), to re-launch it: the request's fields as
        the database keeps them. The requested `density` is NOT stored — `effectiveDensity` is the
        Barabási–Albert m the run used (`clamp(floor(density × densityFactor), 1, agentsPerNetwork − 1)`).
        A client that sends the request again needs a `density` that yields the same
        `effectiveDensity` under its role's `densityFactor`. `persistFrames` is not stored.
      properties:
        runId:
          type: string
        type:
          type: string
          enum: [generated]
        numberOfNetworks:
          type: integer
        agentsPerNetwork:
          type: integer
          description: Sum of `agentTypes[].count`.
        effectiveDensity:
          type: integer
        iterationLimit:
          type: integer
        stopThreshold:
          type: number
          format: float
        seed:
          type: string
          pattern: '^-?[0-9]+$'
          description: Same value as the run summary's `seed` (decimal string).
        frameRetention:
          type: string
          enum: [ephemeral, persistent]
        agentTypes:
          type: array
          description: One row per (silenceStrategy, silenceEffect), sorted by code.
          items:
            $ref: '#/components/schemas/AgentType'
        biasTypes:
          type: array
          description: One row per biasType, sorted by code.
          items:
            $ref: '#/components/schemas/BiasType'

    AgentType:
      type: object
      required: [silenceStrategy, silenceEffect, count]
      properties:
        silenceStrategy:
          type: integer
          enum: [0, 1, 2, 3]
          description: "0=DEGROOT, 1=MAJORITY, 2=THRESHOLD, 3=CONFIDENCE"
        silenceEffect:
          type: integer
          enum: [0, 1, 2]
          description: "0=DEGROOT, 1=MEMORY, 2=MEMORYLESS"
        count:
          type: integer
          minimum: 1
          description: Number of agents of this type

    BiasType:
      type: object
      required: [biasType, count]
      properties:
        biasType:
          type: integer
          enum: [0, 1, 2, 3, 4]
          description: "0=DEGROOT, 1=CONFIRMATION, 2=BACKFIRE, 3=AUTHORITY, 4=INSULAR"
        count:
          type: integer
          minimum: 1
          description: |
            Total number of EDGES in the network (not agents).
            Formula: density*(density-1) + (numberOfAgents - density) * 2*density
            The server requires the counts (one per distinct `biasType`) to cover the edges of the
            network built with `effectiveDensity`; otherwise `400 invalid_body`.

    GeneratedRunRequest:
      type: object
      required: [numberOfNetworks, density, iterationLimit, stopThreshold, saveMode, agentTypes, biasTypes]
      properties:
        numberOfNetworks:
          type: integer
          minimum: 1
          description: Capped per role by `usageLimits.maxNetworks` (`422 usage_limit_exceeded`).
        density:
          type: integer
          minimum: 1
          description: |
            Requested Barabási–Albert m parameter (edges added per new node). Must satisfy
            `1 ≤ density < agentsPerNetwork` (the sum of `agentTypes[].count`), otherwise
            `400 invalid_body`. The server builds the networks with
            `effectiveDensity = clamp(floor(density × densityFactor), 1, agentsPerNetwork − 1)`
            and returns it in the response.
        iterationLimit:
          type: integer
          minimum: 1
        stopThreshold:
          type: number
          format: float
          description: Convergence threshold (e.g. 0.001)
        seed:
          type: integer
          format: int64
          nullable: true
          description: |
            RNG seed. `null`, omitted or `-1`: the server draws one uniformly in `[0, 2^53 − 1]`
            (exact as a JavaScript number) and returns it as the run summary's `seed`. The same
            seed with the same configuration replays the run's networks and dynamics (#127): the
            server compensates the run id the simulator mixes into its random streams. Agent-type
            rows are merged by (silenceStrategy, silenceEffect) and sorted by code before the
            simulator assigns them to agents, so their order in the request does not matter.
        saveMode:
          type: integer
          description: Required but currently ignored — every run is saved in DEBUG mode (#133).
        agentTypes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AgentType'
        biasTypes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BiasType'
        persistFrames:
          type: boolean
          default: false
          description: |
            When `true`, the backend persists every WS round frame so they can be replayed via
            `GET /simulations/{runId}/networks/{networkId}/frames`. Enables timeline scrubbing,
            page-refresh resilience mid-simulation, and recovery for sims that complete before
            the WebSocket connects.
        frameRetention:
          type: string
          enum: [ephemeral, persistent]
          default: ephemeral
          description: |
            Retention policy for persisted frames. `ephemeral` (default) deletes frames 60–90 minutes
            after the run leaves the `running` state (60 min grace, cleanup every 30 min). `persistent` keeps them indefinitely and is
            restricted to users with the `Administrator` role; non-admins requesting `persistent`
            receive `403 forbidden`.

    Agent:
      type: object
      required: [name, belief, toleranceRadius, toleranceOffset, silenceStrategy, silenceEffect]
      properties:
        name:
          type: string
          maxLength: 32
          description: |
            Agent name, at most 32 characters (counted as characters, not bytes — the
            `custom_agents.name` column is `varchar(32)`). Longer names → `400 invalid_body`.
            Must be unique within the network (exact, case-sensitive match: `custom_agents` is
            keyed by `(run_id, name)` and edges refer to agents by name); a repeated name →
            `400 invalid_body` ("Duplicate agent name '<name>'").
        belief:
          type: number
          format: float
          minimum: 0
          maximum: 1
        toleranceRadius:
          type: number
          format: float
        toleranceOffset:
          type: number
          format: float
        silenceStrategy:
          type: integer
          enum: [0, 1, 2, 3]
          description: "0=DEGROOT, 1=MAJORITY, 2=THRESHOLD, 3=CONFIDENCE"
        silenceEffect:
          type: integer
          enum: [0, 1, 2]
          description: "0=DEGROOT, 1=MEMORY, 2=MEMORYLESS"

    Edge:
      type: object
      description: |
        Directed edge. `source` influences `target`: the `target` agent updates its belief from the
        `source` agent's opinion; `influence` is the weight `target` gives to `source`'s opinion.
        An agent's own weight (DeGroot self-weight) is the self-loop `A -> A`. An agent that is the
        `target` of no edge is influenced by nobody, so its belief does not change.
      required: [source, target, influence, bias]
      properties:
        source:
          type: string
          description: Name of the influencing agent (whose opinion the `target` takes into account).
        target:
          type: string
          description: Name of the influenced agent (the agent whose belief is updated).
        influence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Weight `target` gives to `source`'s opinion.
        bias:
          type: integer
          enum: [0, 1, 2, 3, 4]
          description: |
            Cognitive bias `target` applies to `source`'s opinion.
            0=DEGROOT, 1=CONFIRMATION, 2=BACKFIRE, 3=AUTHORITY, 4=INSULAR

    CustomRunRequest:
      type: object
      required: [name, iterationLimit, stopThreshold, saveMode, agents, edges]
      properties:
        name:
          type: string
          maxLength: 32
          description: |
            Network name, at most 32 characters (counted as characters, not bytes — the
            `custom_runs.run_name` column is `varchar(32)`). Longer names → `400 invalid_body`.
        iterationLimit:
          type: integer
          minimum: 1
        stopThreshold:
          type: number
          format: float
        saveMode:
          type: integer
          description: Required but currently ignored — every run is saved in DEBUG mode (#133).
        agents:
          type: array
          minItems: 1
          description: Agent names must be unique within the network (exact, case-sensitive match).
          items:
            $ref: '#/components/schemas/Agent'
        edges:
          type: array
          description: |
            Every `source` / `target` must be the `name` of an agent in `agents`. Each directed
            pair (`source`, `target`) may appear only once (exact match: `custom_neighbors` is
            keyed by `(run_id, source, target)`; the reverse edge is a different pair); a repeated
            edge → `400 invalid_body` ("Duplicate edge '<source>' -> '<target>'").
          items:
            $ref: '#/components/schemas/Edge'
        persistFrames:
          type: boolean
          default: false
          description: |
            When `true`, the backend persists every WS round frame so they can be replayed via
            `GET /simulations/{runId}/networks/{networkId}/frames`.
        frameRetention:
          type: string
          enum: [ephemeral, persistent]
          default: ephemeral
          description: |
            `ephemeral` deletes frames 60–90 minutes after the run leaves `running`. `persistent`
            keeps them indefinitely and is restricted to Administrators.

    PolarizationParam:
      type: object
      description: |
        A parameter of a measure, read from the class constructor (defaults are the package's).
        `number`: a finite number in (`minExclusive`, `max`] (`null` bound = none; the package
        enforces these: EstebanRay `0 < alpha <= 1.6`, the others `> 0`); `nullable` ones accept
        `null` (= the package's default, e.g. EstebanRay's normalization `K`). `choice`: one of
        `options` (the alienation function f(d) of GeneralizedER / GeneralizedMEC, a named
        whitelist; see `alienations`).
      required: [name, type, default]
      properties:
        name:
          type: string
          example: alpha
        type:
          type: string
          enum: [number, choice]
        default:
          nullable: true
          oneOf:
            - type: number
            - type: string
          example: 0.8
        nullable:
          type: boolean
          description: "`number` only."
        minExclusive:
          type: number
          nullable: true
          description: "`number` only."
          example: 0
        max:
          type: number
          nullable: true
          description: "`number` only (inclusive)."
          example: 1.6
        options:
          type: array
          description: "`choice` only."
          items:
            type: string
          example: ['d', 'd^2', 'd^3', 'd+d^2', 'd+2d^2', 'exp(d)-1', 'exp(2d)-1']

    PolarizationClassification:
      type: object
      description: |
        Level thresholds of pol_measures (`measures.thresholds`) for the run charts' scheme: method
        `kmeans` (the package's default), 3 levels. A value below `thresholds[i]` is
        `levels[i]`, otherwise the last level. Only defined when the parameters match a parameter
        set the package calibrated (EstebanRay alpha = 0.8, MECNormalized alpha = 2 and
        beta = 1.15, BiPol).
      required: [method, paramSet, params, levels, thresholds]
      properties:
        method:
          type: string
          example: kmeans
        paramSet:
          type: string
          example: default
        params:
          type: object
          additionalProperties:
            type: number
          example: {alpha: 0.8}
        levels:
          type: array
          items:
            type: string
          example: [low, medium, high]
        thresholds:
          type: array
          items:
            type: number
          example: [0.3791, 0.5141]

    PolarizationMeasure:
      type: object
      required: [id, name, kind, beta, params, categories, hasThresholds, classification]
      properties:
        id:
          type: string
          description: The package's class name (`measures.metrics.literature` / `.proposed` `__all__`).
          example: EstebanRay
        name:
          type: string
          example: Esteban–Ray
        kind:
          type: string
          enum: [literature, proposed]
        beta:
          type: boolean
          description: Still being developed upstream (MECNormalized, per the package README).
        params:
          type: array
          items:
            $ref: '#/components/schemas/PolarizationParam'
        categories:
          type: array
          description: The k in 2..10 the measure is defined for (Experts only 5; VanDerEijkPol from 3).
          items:
            type: integer
          example: [2, 3, 4, 5, 6, 7, 8, 9, 10]
        hasThresholds:
          type: boolean
          description: The package has thresholds for this measure (for some parameter set).
        classification:
          description: The thresholds that apply with the DEFAULT parameters, or null.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PolarizationClassification'

    PolarizationPackage:
      type: object
      properties:
        name:
          type: string
          example: measures
        version:
          type: string
          example: 0.1.0a2
        commit:
          type: string
          description: The installed commit (pip's `direct_url.json`).
          example: 0e05564ed0b7b23de368dd19becac3a1de4ef745
        url:
          type: string
          nullable: true
          example: https://github.com/Ulvenforst/pol_measures.git

    PolarizationCatalog:
      type: object
      required: [measures, alienations, classification, limits, package]
      properties:
        measures:
          type: array
          items:
            $ref: '#/components/schemas/PolarizationMeasure'
        alienations:
          type: array
          description: The f(d) options of GeneralizedER / GeneralizedMEC.
          items:
            type: object
            required: [id, label, tex]
            properties:
              id:
                type: string
                example: exp(d)-1
              label:
                type: string
                example: "eᵈ − 1"
              tex:
                type: string
                example: e^{d} - 1
        classification:
          type: object
          properties:
            method:
              type: string
              example: kmeans
            levels:
              type: integer
              example: 3
        limits:
          type: object
          properties:
            minCategories:
              type: integer
              example: 2
            maxCategories:
              type: integer
              example: 10
            maxRounds:
              type: integer
              description: Histograms per `POST /simulations/polarization`.
              example: 20000
            maxBodyBytes:
              type: integer
              example: 8388608
        package:
          $ref: '#/components/schemas/PolarizationPackage'
        versions:
          type: object
          properties:
            numpy:
              type: string
              example: 2.5.4
            scipy:
              type: string
              example: 1.18.1
            python:
              type: string
              example: 3.12.3

    PolarizationRequest:
      type: object
      required: [measure, k, histograms]
      properties:
        measure:
          type: string
          description: A catalog `id`.
          example: EstebanRay
        params:
          type: object
          description: |
            Parameter values by name (numbers, a `choice` id, or `null` for a nullable one).
            Missing ones take the package's default.
          additionalProperties: true
          example: {alpha: 0.8}
        k:
          type: integer
          minimum: 2
          maximum: 10
          description: Number of categories; the positions are `x_j = j / (k - 1)`.
          example: 5
        histograms:
          type: array
          minItems: 1
          maxItems: 20000
          description: |
            One histogram per round, each with exactly `k` finite weights >= 0 (agent counts or
            fractions: the worker normalizes them to sum 1, the package's
            `normalize_weights=True`). Identical histograms are computed once. An all-zero
            histogram is a per-round error, not a request error.
          items:
            type: array
            items:
              type: number
              minimum: 0
          example: [[10, 0, 0, 0, 10], [0, 0, 20, 0, 0], [0, 0, 0, 0, 0]]

    PolarizationResult:
      type: object
      required: [values, levels, classification, unique, package]
      properties:
        values:
          type: array
          description: One per histogram, in order; `null` where the package raised or gave a non-finite value.
          items:
            type: number
            nullable: true
          example: [0.9999999999999999, 0.0, null]
        levels:
          type: array
          description: The level of each value (`classification`), `null` without classification.
          items:
            type: string
            nullable: true
          example: [high, low, null]
        errors:
          type: array
          description: "Only when some round failed: the package's exception (`Type: message`) or `null`."
          items:
            type: string
            nullable: true
          example: [null, null, "ValueError: At least one weight must be positive"]
        classification:
          description: The thresholds that apply to the REQUESTED parameters, or null.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PolarizationClassification'
        unique:
          type: integer
          description: Distinct histograms actually computed.
          example: 3
        package:
          type: object
          required: [ref, version]
          properties:
            ref:
              type: string
              description: The installed pol_measures commit.
              example: 0e05564ed0b7b23de368dd19becac3a1de4ef745
            version:
              type: string
              example: 0.1.0a2

security:
  - BearerAuth: []

tags:
  - name: Users
  - name: Simulations
  - name: Polarization
  - name: WebSocket

paths:

  # ── Users ──────────────────────────────────────────────────────────────────

  /api/users/sync:
    post:
      tags: [Users]
      summary: Sync authenticated user to DB
      description: |
        Creates or updates the user record from the Firebase token.
        Automatically promotes to Administrator if the email is in `BOOTSTRAP_ADMIN_EMAILS`.
      responses:
        '200':
          description: User info with roles and usage limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/info/{uid}:
    get:
      tags: [Users]
      summary: Get user info
      description: Owner or Administrator only.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/me/deactivate:
    post:
      tags: [Users]
      summary: Deactivate own account
      description: |
        Sets `deactivated = true` for the authenticated user (the account comes from the token;
        no body). Idempotent: it changes nothing else, and a repeated call is either another `200`
        (concurrent) or the `401` every deactivated account gets.

        From then on every protected REST call of the account (this one included) is rejected
        with `401 {"error": "unauthorized", "message": "Account is deactivated"}`; the Firebase
        account itself is untouched. Reactivation has no endpoint: an administrator sets
        `users.deactivated = false` in the database.
      responses:
        '200':
          description: Account deactivated
          content:
            application/json:
              schema:
                type: object
                required: [deactivated]
                properties:
                  deactivated:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The account could not be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal_error
                message: Failed to deactivate account

  /api/users/role/{uid}/{role}:
    put:
      tags: [Users]
      summary: Add role to user
      description: Administrator only.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [Administrator, Researcher, BaseUser, Guest]
      responses:
        '200':
          description: Role added
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  role:
                    type: string
                  action:
                    type: string
                    example: added
        '400':
          description: Invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Simulations ────────────────────────────────────────────────────────────

  /simulations/generated:
    post:
      tags: [Simulations]
      summary: Start a generated (Barabási–Albert) simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedRunRequest'
            example:
              numberOfNetworks: 1
              density: 4
              iterationLimit: 100
              stopThreshold: 0.001
              seed: null
              saveMode: 2
              agentTypes:
                - silenceStrategy: 0
                  silenceEffect: 0
                  count: 10
              biasTypes:
                - biasType: 0
                  count: 60
      responses:
        '200':
          description: Run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimCreated'
              example:
                runId: "7311520245839011840"
                status: running
                networkCount: 1
                effectiveDensity: 2
                wsUrl: /ws
        '400':
          description: |
            `invalid_body` — the network cannot be built: `numberOfNetworks < 1`,
            `iterationLimit < 1`, empty `agentTypes` / `biasTypes` or a count `< 1`, unknown
            strategy / effect / bias code, `density < 1` or `density ≥ agentsPerNetwork`, or bias
            counts that do not cover the edges of the network.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: |
            `usage_limit_exceeded` — agents per network, `iterationLimit` or `numberOfNetworks`
            exceed the caller's `usageLimits` (`maxAgents`, `maxIterations`, `maxNetworks`).
            Body: `{error, message, limit, requested}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /simulations/custom:
    post:
      tags: [Simulations]
      summary: Start a custom (explicit graph) simulation
      description: >
        Accepts two content types. Use `application/json` for networks with fewer than 1000
        agents. For larger networks, send `application/octet-stream` with the binary
        little-endian payload (the format of the removed legacy `POST /custom`) to avoid
        serializing a large JSON body. The binary payload has no `persistFrames` /
        `frameRetention` fields, so the binary variant takes them as query parameters.
      parameters:
        - name: persistFrames
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            Binary (`application/octet-stream`) variant only — JSON requests use the body field of
            the same name and ignore this parameter. Same meaning and default as
            `CustomRunRequest.persistFrames`. Accepts `true` / `false` (any case); any other value
            → `400 invalid_body`.
        - name: frameRetention
          in: query
          required: false
          schema:
            type: string
            enum: [ephemeral, persistent]
            default: ephemeral
          description: |
            Binary (`application/octet-stream`) variant only — JSON requests use the body field of
            the same name and ignore this parameter. Same meaning and default as
            `CustomRunRequest.frameRetention`: `persistent` requires the `Administrator` role
            (`403 forbidden`); an unknown value → `400 invalid_body`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRunRequest'
            example:
              name: my-network
              iterationLimit: 100
              stopThreshold: 0.001
              saveMode: 2
              agents:
                - name: A
                  belief: 0.2
                  toleranceRadius: 0.5
                  toleranceOffset: 0.0
                  silenceStrategy: 0
                  silenceEffect: 0
                - name: B
                  belief: 0.8
                  toleranceRadius: 0.5
                  toleranceOffset: 0.0
                  silenceStrategy: 0
                  silenceEffect: 0
              edges:
                - source: A
                  target: B
                  influence: 0.5
                  bias: 0
                - source: B
                  target: A
                  influence: 0.5
                  bias: 0
          application/octet-stream:
            schema:
              type: string
              format: binary
            description: >
              Binary payload (little-endian). Recommended for networks with 1000 or more
              agents. Format is identical to the binary protocol of the removed legacy
              `POST /custom` (byte layout: `Server.decodeCustomRunUnchecked` in the backend,
              `custom-simulation-encoder.ts` in the frontend). String length prefixes are
              unsigned bytes. Subject to the same validation, role quotas and persistence as the
              JSON variant (a `custom_runs` row owned by the caller), including the 32-character
              limit on the network and agent names, unique agent names and unique edges. Frame
              persistence is requested with the
              `persistFrames` / `frameRetention` query parameters, e.g.
              `POST /simulations/custom?persistFrames=true&frameRetention=ephemeral`.
      responses:
        '200':
          description: Run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimCreated'
        '400':
          description: |
            `invalid_body` — malformed or truncated binary payload, no agents, `iterationLimit < 1`,
            a network or agent name longer than 32 characters, a repeated agent name (names must
            be unique within the network), unknown strategy / effect / bias code, an edge naming
            an agent that is not defined, a repeated edge (same `source` and `target`), or an
            invalid `frameRetention`
            (body field, or query parameter on the binary variant) / `persistFrames` query
            parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "`forbidden` — `frameRetention=persistent` requested by a non-Administrator."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: |
            `usage_limit_exceeded` (JSON and binary variants) — the agent count or
            `iterationLimit` exceed the caller's `usageLimits`. Body: `{error, message, limit, requested}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            `internal_error` — the run could not be saved (`custom_runs` row and its agents /
            edges); it was NOT started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /simulations/polarization/measures:
    get:
      tags: [Polarization]
      summary: Polarization measures catalog (pol_measures)
      description: |
        Every measure pol_measures exports with its parameters (the package's defaults and
        ranges), the k it supports, its classification thresholds for the default parameters,
        the f(d) options, the request limits and the package / numpy / SciPy / Python versions
        (#129). Cached in memory after the first call. Starts the worker if it is not running.
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarizationCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "`not_found` — `APP_POLARIZATION=false`: the feature is disabled on this server."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
                message: Polarization measures are disabled on this server (APP_POLARIZATION=false)
        '503':
          description: "`unavailable` — the worker could not be started or did not answer."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unavailable
                message: "The polarization worker could not be started: it exited during startup (exit code 1)"

  /simulations/polarization:
    post:
      tags: [Polarization]
      summary: Polarization of a series of histograms (pol_measures)
      description: |
        Computes one measure, with the given parameters, on each histogram (one per round), with
        the real pol_measures package (#129). Each histogram is normalized to sum 1; identical
        histograms are computed once. Per-round failures (e.g. an all-zero histogram) are `null`
        values with the package's message in `errors`. Levels are given when the parameters match
        one of the package's calibrated parameter sets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolarizationRequest'
      responses:
        '200':
          description: One value / level (/ error) per histogram, in order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarizationResult'
        '400':
          description: |
            `invalid_body` — not JSON, a missing or mistyped member, `k` outside 2..10, no
            histograms or more than 20000, a histogram without exactly `k` weights, or a weight
            that is negative or not finite (`fields` names the member, e.g. `histograms[3][1]`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_body
                message: Invalid polarization request
                fields:
                  - field: histograms[0][2]
                    issue: must be a finite number >= 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "`not_found` — `APP_POLARIZATION=false`: the feature is disabled on this server."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: "`payload_too_large` — the body exceeds 8 MiB (8388608 bytes)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: |
            `invalid_measure` — unknown measure, unknown parameter, a parameter outside the
            package's range or rejected by its constructor / checks, or a `k` the measure is not
            defined for (Experts: only 5) (`fields`: `measure`, `params.<name>` or `k`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_measure
                message: Experts is not defined for k = 3 categories
                fields:
                  - field: k
                    issue: "supported: 5"
        '503':
          description: |
            `unavailable` — the worker could not be started, timed out (30 s), crashed or answered
            malformed output (it is restarted; retry), or is busy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unavailable
                message: The polarization worker did not answer within 30 s; this request was not computed (the worker is being restarted, retry)

  /simulations/mine:
    get:
      tags: [Simulations]
      summary: List own runs (paginated)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunSummary'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /simulations:
    get:
      tags: [Simulations]
      summary: List all runs — Administrator only
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of all runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunSummary'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /simulations/{runId}:
    get:
      tags: [Simulations]
      summary: Get run summary
      description: Owner or Administrator only.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Run summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Simulations]
      summary: Cancel a running run
      description: |
        Owner or Administrator only. Cancels a run that is still `running`: its status becomes
        `cancelled` (with `completed_at`) and the simulation is stopped. Nothing is deleted — the run
        row stays and its frames follow `frameRetention`.

        A run that already finished (`completed`, `cancelled` or `error`) keeps its status and the
        request answers `409 conflict`. Only `/simulations/{runId}` itself accepts `DELETE`; sub-paths
        such as `/simulations/{runId}/networks` do not.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  cancelled:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The run already finished; its terminal status is kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: conflict
                message: Run already finished
        '500':
          description: "`internal_error` — the status could not be updated; the run was not cancelled."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /simulations/{runId}/config:
    get:
      tags: [Simulations]
      summary: Stored configuration of a generated run
      description: |
        The configuration a generated run was created with, as stored (#127), so a client can
        re-launch it (the frontend pre-fills its wizard; nothing is started). Owner or
        Administrator only. Custom runs answer `404`: they are re-launched from their exported
        configuration file, and their networks are not rebuilt from the database.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Stored configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedRunConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Run not found, a custom run, or a generated run whose distribution rows are missing
            (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /simulations/{runId}/networks:
    get:
      tags: [Simulations]
      summary: List networks for a run
      description: |
        Returns the networkIds whose topology is held in memory (cached at `topology_ready`, kept
        while the run is `running` and for the retention window after it ends — see "Retention of
        run data"), sorted by networkId (UUID v7, so roughly creation order).

        When memory no longer holds the run (retention expired, memory budget, backend restart), it
        falls back to the networks that still have persisted frames
        (`SELECT DISTINCT network_id FROM network_frames WHERE run_id = ?`, same order). In that case
        `/topology` and `/results` may answer `202` for those networks — only the frames remain.

        Empty array if the run has not yet emitted `topology_ready`, or if it finished and neither its
        snapshots nor any frames are retained. Owner or Administrator only.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Network list
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  networks:
                    type: array
                    items:
                      type: string
                      format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Run not found

  /simulations/{runId}/networks/{networkId}/topology:
    get:
      tags: [Simulations]
      summary: Get initial network topology
      description: |
        Returns the full graph snapshot captured at simulation start (after `topology_ready` event).
        Returns `202 Accepted` if the snapshot is not in memory: for a `running` run, the network has
        not yet reached `topology_ready`; for a finished run, it is no longer retained (retention
        window, memory budget or backend restart — see "Retention of run data") and will not come
        back. Owner or Administrator only.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: networkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: agentOffset
          in: query
          schema:
            type: integer
            default: 0
        - name: agentLimit
          in: query
          schema:
            type: integer
            default: 500
        - name: edgeOffset
          in: query
          schema:
            type: integer
            default: 0
        - name: edgeLimit
          in: query
          schema:
            type: integer
            default: 1000
      responses:
        '200':
          description: Paginated topology snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  networkId:
                    type: string
                  agentCount:
                    type: integer
                    description: Total agents in the network
                  edgeCount:
                    type: integer
                    description: Total edges in the network
                  agentOffset:
                    type: integer
                  agentLimit:
                    type: integer
                  edgeOffset:
                    type: integer
                  edgeLimit:
                    type: integer
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        name:
                          type: string
                          nullable: true
                        initialBelief:
                          type: number
                          format: float
                        toleranceRadius:
                          type: number
                          format: float
                        toleranceOffset:
                          type: number
                          format: float
                        silenceStrategy:
                          type: integer
                          enum: [0, 1, 2, 3]
                          description: "0=DEGROOT, 1=MAJORITY, 2=THRESHOLD, 3=CONFIDENCE"
                        silenceEffect:
                          type: integer
                          enum: [0, 1, 2]
                          description: "0=DEGROOT, 1=MEMORY, 2=MEMORYLESS"
                  edges:
                    type: array
                    description: |
                      Directed edges, same semantics as the custom-run `Edge`, for custom and
                      generated networks alike: `source` influences `target` — the `target` agent
                      updates its belief from the `source` agent's opinion; `influence` is the weight
                      `target` gives to `source`'s opinion. Edges come grouped by `target` (the
                      simulator's CSR row order, see the topology binary in the WebSocket docs).
                    items:
                      type: object
                      properties:
                        source:
                          type: integer
                          description: Index of the influencing agent.
                        target:
                          type: integer
                          description: Index of the influenced agent (the agent whose belief is updated).
                        influence:
                          type: number
                          format: float
                          description: Weight `target` gives to `source`'s opinion.
                        bias:
                          type: integer
                          enum: [0, 1, 2, 3, 4]
                          description: |
                            Cognitive bias `target` applies to `source`'s opinion.
                            0=DEGROOT, 1=CONFIRMATION, 2=BACKFIRE, 3=AUTHORITY, 4=INSULAR
        '202':
          description: |
            Topology not available — retry after `topology_ready` while the run is `running`; for a
            finished run the snapshot is no longer retained.
        '400':
          description: |
            `invalid_body` — a pagination parameter is negative or not an integer (`fields`
            names each one).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Run not found

  /simulations/{runId}/networks/{networkId}/results:
    get:
      tags: [Simulations]
      summary: Get final network results
      description: |
        Returns per-agent final beliefs captured at convergence (after `network_converged` event).
        Returns `202 Accepted` if the snapshot is not in memory: the network has not converged yet,
        or — for a finished run — it is no longer retained (see "Retention of run data").
        Owner or Administrator only.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: networkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        '200':
          description: Paginated convergence results
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  networkId:
                    type: string
                  finalRound:
                    type: integer
                  consensus:
                    type: boolean
                  agentCount:
                    type: integer
                    description: Total agents in the network
                  offset:
                    type: integer
                  limit:
                    type: integer
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        name:
                          type: string
                          nullable: true
                        finalBelief:
                          type: number
                          format: float
                        publicBelief:
                          type: number
                          format: float
        '202':
          description: |
            Results not available — retry after `network_converged` while the run is `running`; for
            a finished run the snapshot is no longer retained.
        '400':
          description: |
            `invalid_body` — `offset` or `limit` is negative or not an integer (`fields` names
            each one).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Run not found

  /simulations/{runId}/networks/{networkId}/frames:
    get:
      tags: [Simulations]
      summary: Replay persisted WS frames
      description: |
        Returns binary frames byte-for-byte identical to what the WebSocket emits, so a client
        can reuse its WS parser. Requires the run to have been created with `persistFrames=true`.
        Owner or Administrator only.

        Query forms (mutually exclusive):
        - `?round=N` — single round
        - `?round=last` — most recent persisted round
        - `?from=A&to=B` — inclusive range, capped at **1000 rounds per request**

        Returns `404 frames_not_persisted` if `persistFrames=false` on the run, if the requested
        rounds were never emitted, or if ephemeral frames already expired.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: networkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: round
          in: query
          schema:
            oneOf:
              - type: integer
              - type: string
                enum: [last]
        - name: from
          in: query
          schema:
            type: integer
        - name: to
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: |
            Concatenation of WS slices ordered by `(round, starts_at)`. Each slice has the same
            36-byte header + (publicBelief, privateBelief, speaking) payload as the WS stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid range or `range_too_large`
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Frames not persisted or expired

  # ── WebSocket ──────────────────────────────────────────────────────────────

  /ws:
    get:
      tags: [WebSocket]
      summary: Persistent authenticated WebSocket
      description: |
        Upgrades the connection to a single persistent WebSocket per user session.
        Open once at login; keep it alive for the entire session.

        ## Handshake (client → server, first message)

        Auth must be the very first message. Until it succeeds, a well-formed `subscribe` /
        `unsubscribe` is ignored and answered with `{"type": "error", "code": "auth_required"}`.
        A failed auth gets the `auth_failed` error below, and then the server closes the
        connection with a normal closure (close code `1000`). Akka HTTP 10.5 cannot send a custom
        close code such as `1008` from the server; a client should treat this close like a policy
        violation and not reconnect with the same token (the SiLEnSeSS frontend does not retry on
        `1000` or `1008`).

        The token is verified exactly as on REST, revocation check included (#123): see *Errors*
        in the API description.

        ```json
        {"type": "auth", "token": "<Firebase idToken>"}
        ```

        Server responds (server → client):
        ```json
        {"type": "auth_ok", "userId": "<uid>"}
        ```
        or on failure:
        ```json
        {"type": "error", "code": "auth_failed"}
        {"type": "error", "code": "auth_failed", "reason": "token_revoked"}
        {"type": "error", "code": "auth_failed", "reason": "account_deactivated"}
        ```
        `reason` is present only when a token with a VALID signature is refused: `token_revoked`
        (revoked session, or disabled or deleted Firebase account; same fail-open check as REST) or
        `account_deactivated` (deactivated in the database, like the REST
        `401 "Account is deactivated"`). An invalid or expired token gets no `reason`.

        ## Subscribe to a run (client → server)

        Send after `POST /simulations/generated` or `POST /simulations/custom` returns `runId`.
        Can be sent before the simulation starts — **this eliminates the race condition**.

        ```json
        {"type": "subscribe", "runId": "<runId>"}
        ```

        **Replay buffer.** The server keeps every event emitted for a run (control events and
        binary frames, in original wire order) in an in-memory buffer keyed by `runId` — created on
        the run's first event even before anyone subscribes, so late subscribers (the run starts
        before the client's `subscribe`, page refreshes, reconnects) still get the beginning. On
        subscribe the buffer is drained to the client before live events flow, so a subscriber
        joining mid-run or just after `run_completed` sees the full sequence — including
        `network_started` and any binary frames already emitted. The buffer is evicted 60
        minutes after the run reaches a terminal state, after which the server falls back to
        a DB-backed replay.

        Byte caps only ever drop **binary frames** (oldest first); control events are never dropped
        while the buffer lives. Per run the cap is 200 MB; across all runs `APP_WS_BUFFER_BUDGET_MB`
        (default min(1024 MB, heap/4)) — when it is exceeded, buffers of finished runs are evicted
        first (oldest first; their subscribers get the DB replay), then the oldest frames of the
        largest running buffer are dropped.

        **Per-connection outbound queue.** Each connection hands the socket one message at a time and
        queues the rest. Control events (JSON text) are never dropped there either. Binary frames
        are capped per connection by `APP_WS_CONNECTION_BUFFER_MB` (default min(32 MB, heap/64)):
        when the client reads slower than frames arrive — or a large buffer drain exceeds the cap —
        the oldest queued frames are dropped (the server logs it, at most every 10 s per
        connection); fetch missed rounds from `GET /frames`. Messages that are delivered always keep
        their original order. If a client stops reading altogether and 1 000 000 control events pile
        up, the server closes the connection with code `1011` instead of dropping one; reconnect
        and resubscribe.

        **If the run is still running:** the server registers the connection, drains the
        buffer (any events emitted before subscribe), and live events continue to flow.

        **If the run is already completed:** the buffer drain delivers the full sequence
        in the same order as live emission — see "Live event order per network" below.
        After 60 minutes the buffer is gone and the server falls back to DB replay, for every
        network that has persisted frames (`network_frames.run_id`): `topology_ready` →
        `network_started` → its frame binaries → `network_converged` (only while the results
        snapshot is still in memory); then `run_completed`, or the `error` event if the run's
        status is `error`. Frames are sent exactly as live: **one binary message per persisted frame
        partition**, in `(round, startsAt)` order. The replay is paced by the connection (the next
        page of frames is read from the DB only once the outbound queue has drained to half its
        cap), so it does not drop frames on a client that keeps reading. No topology binary is
        replayed — fetch the topology via `GET /topology` while it is retained.

        **If the run does not exist:**
        ```json
        {"type": "error", "code": "run_not_found", "runId": "<runId>"}
        ```

        ## Unsubscribe (client → server)

        ```json
        {"type": "unsubscribe", "runId": "<runId>"}
        ```

        ## Malformed client messages

        A client message the server cannot read — not JSON, not a JSON object, `type` missing, not
        a string or unknown, `token` / `runId` missing or not a string, `runId` not a decimal int64,
        a text longer than 65 536 characters, or any binary message — is answered with (before or
        after auth):
        ```json
        {"type": "error", "code": "invalid_message", "message": "subscribe: \"runId\" must be a string"}
        ```
        `message` is a short human-readable reason, not a stable identifier. The message is
        otherwise ignored and **the connection keeps its state** (authentication, subscriptions):
        since #119 malformed input no longer resets it. A text sent in several WebSocket frames is
        reassembled before it is read. A repeated `auth` on an authenticated connection is ignored.
        If the server fails unexpectedly while handling a well-formed message (e.g. no database
        connection), it answers `{"type": "error", "code": "internal_error"}` and also keeps the
        connection.

        ## Live event order per network

        For each network in the run, in this exact order:

        1. `topology_ready` JSON event — the topology is ready at
           `GET /simulations/{runId}/networks/{networkId}/topology`.
        2. `network_started` JSON event.
        3. **Frame binary** (one per `AgentProcessor` per round, 36-byte header) — repeated
           until convergence or iteration limit.
        4. `network_converged` JSON event.

        Only with `APP_WS_SEND_TOPOLOGY=true` the **topology binary** (32-byte header, below) is
        also sent, right before `topology_ready`.

        After every network finishes, the run emits `run_completed`. If the run fails instead, it
        emits `error` (and its status becomes `error`); no `run_completed` follows.

        ## Control events (server → client, JSON text frames)

        ```json
        {"event": "topology_ready",    "runId": "...", "networkId": "..."}
        {"event": "network_started",   "runId": "...", "networkId": "..."}
        {"event": "network_converged", "runId": "...", "networkId": "...", "finalRound": 10, "consensus": true}
        {"event": "run_completed",     "runId": "..."}
        {"event": "error",             "runId": "...", "code": "run_failed", "message": "Simulation failed: ..."}
        ```

        `finalRound` is the network's last round (the `finalRound` of `GET /results`), with the same
        name on the live path and in the DB replay. Backends before #119 named it `round` on the
        live path; a client that must support them can fall back to `round`.

        `error` is terminal for the run: an actor of the run failed, the run was stopped and its status
        is `error`. `message` is a short human-readable reason. Runs killed by a backend restart are
        not notified live (the connection is gone); they show `error` in `GET /simulations/{runId}`
        and in the DB replay.

        On `topology_ready`, fetch the topology via
        `GET /simulations/{runId}/networks/{networkId}/topology` (it is cached at that moment).

        ## Topology binary (server → client, off by default)

        Full adjacency snapshot in CSR (Compressed Sparse Row) layout. **Sent only when the backend
        runs with `APP_WS_SEND_TOPOLOGY=true`** — off by default since #119: clients read the
        topology from `GET /topology`, and this message weighs several MB per large network on the
        socket and in the run's replay buffer. When enabled it is emitted once per network, right
        before `topology_ready`. Little-endian throughout.

        ```
        Header (32 bytes):
          0-7    int64    networkId.mostSigBits
          8-15   int64    networkId.leastSigBits
          16-23  int64    runId             (Snowflake ID — read with BigInt on JS)
          24-27  int32    numberOfAgents    (= n)
          28-31  int32    numberOfNeighbors (= m, sum of all per-agent degrees)

        Body:
          indexOffset      n × int32    — cumulative neighbor counts (row END pointers). Row i
                                          (agent i) lives at body indices
                                          [indexOffset(i-1), indexOffset(i))
                                          (or [0, indexOffset(0)) for i=0); an empty row
                                          means nobody influences agent i.
          neighborsRefs    m × int32    — per row i, the indices of the agents that INFLUENCE
                                          agent i (agent i updates its belief from them).
          neighborsWeights m × float32  — weight agent i gives to each of them (influence).
          neighborBiases   m × uint8    — cognitive bias agent i applies to each of them.
        ```

        Total: `32 + n*4 + m*9` bytes.

        Rows are grouped by the INFLUENCED agent: entry `j` of row `i` is the `/topology` edge
        `{source: neighborsRefs(j), target: i, influence: neighborsWeights(j)}` ("source
        influences target", same meaning as the custom-run `Edge`). The SiLEnSeSS frontend ignores
        this message and reads the topology from `GET /topology`.

        ## Frame binary (server → client, one per AgentProcessor partition per round)

        Agent belief state per round, little-endian. Wire format is identical to the
        data returned by `GET /simulations/{runId}/networks/{networkId}/frames` — the
        same parser handles both.

        ```
        Header (36 bytes):
          0-7    int64    networkId.mostSigBits
          8-15   int64    networkId.leastSigBits
          16-23  int64    runId           (Snowflake ID — read with BigInt on JS)
          24-27  int32    numberOfAgents  (agents in this partition)
          28-31  int32    round
          32-35  int32    startsAt        (index of the first agent in this partition)

        Belief data (numberOfAgents × 8 bytes) — two consecutive blocks, NOT interleaved:
          36            [publicBelief (float32)] × n    — agent i at 36 + 4i
          36 + 4n       [privateBelief (float32)] × n   — agent i at 36 + 4n + 4i

        Speaking data (numberOfAgents × 1 byte):
          36 + 8n       [isSpeaking (uint8)] × n        — agent i at 36 + 8n + i
        ```

        Total per frame: `36 + 9 × numberOfAgents` bytes. `n` = `numberOfAgents` and `i` is the
        position inside the partition (global agent index = `startsAt + i`).

        **Partitioning.** One round may emit multiple frame binaries with different `startsAt`
        values (one per `AgentProcessor` actor). Each frame covers `[startsAt, startsAt + numberOfAgents)`.
        Merge partitions by `(runId, networkId, round)` before treating a round as complete.

        ## Binary messages

        With the default configuration **round frames are the only binary messages** on the
        socket. Validate each one anyway: `byteLength == 36 + 9 × numberOfAgents` with
        `numberOfAgents > 0`, `round >= 0` and `startsAt >= 0`; drop anything else.

        With `APP_WS_SEND_TOPOLOGY=true` the topology binary shares the channel and the size alone
        is ambiguous: `32 + 4n + 9m == 36 + 9n` whenever `9m = 5n + 4` (e.g. 10 agents / 6 edges),
        and its header (`numberOfNeighbors` at 28-31, `indexOffset[0]` at 32-35) then passes the
        checks above too. Clients that enable it must discriminate by order instead: both carry the
        networkId at bytes 0-15, and per network the topology binary comes before that network's
        `topology_ready`, while its frames only come after its `network_started`.

        **Multiplexing with JSON.** Binary and JSON frames share the same connection.
        Discriminate by `typeof event.data`: `"string"` → JSON control event; otherwise →
        binary (a round frame, or the topology binary when enabled).

        **Bandwidth example.** 100 k agents at 30 Hz, 4 partitions of 25 k:
        `4 × (36 + 9 × 25 000) ≈ 900 KB/s` of round frames.

        ## Reconnect

        On reconnect: re-send `auth`, then re-subscribe to any active runs.
        Each subscribe drains the run's replay buffer (or the DB replay) again — see "Replay
        buffer" — so the client gets the run's events from the start, minus any frames dropped by
        the caps.

        ## Multiple tabs

        Each tab opens its own WebSocket connection. The server tracks all connections for a user
        independently; each manages its own subscription set.
      security: []
      responses:
        '101':
          description: Switching Protocols — WebSocket connection established
        '400':
          description: Not a WebSocket upgrade request
